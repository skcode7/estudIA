services:
  postgres:
    image: postgres:16-alpine
    container_name: estudia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: estudia
      POSTGRES_USER: estudia
      POSTGRES_PASSWORD: estudia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudia -d estudia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
