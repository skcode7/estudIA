services:
  postgres:
    image: postgres:16-alpine
    container_name: estudia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: estudia
      POSTGRES_USER: estudia
      POSTGRES_PASSWORD: estudia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudia -d estudia"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: estudia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: estudia
      MINIO_ROOT_PASSWORD: estudia-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: estudia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 estudia estudia-secret > /dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/estudia-materials;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
